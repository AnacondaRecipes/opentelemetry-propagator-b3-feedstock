{% set name = "opentelemetry-propagator-b3" %}
{% set version = "1.45.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: e3ab95b91a3fd70c89b30bc366702984f1eb811a53416bf8555e700c290997ab

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  entry_points:
    - b3 = opentelemetry.propagators.b3:B3SingleFormat
    - b3multi = opentelemetry.propagators.b3:B3MultiFormat
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.3,<2
    - typing_extensions >=4.5.0

test:
  source_files:
    - tests
  imports:
    - opentelemetry
    - opentelemetry.propagators.b3
  requires:
    - pip
    - opentelemetry-sdk
    - pytest
  commands:
    - pip check
    - python -c "from opentelemetry.propagators.b3 import B3SingleFormat; B3SingleFormat()"
    - python -c "from opentelemetry.propagators.b3 import B3MultiFormat; B3MultiFormat()"
    - python -c "from importlib.metadata import entry_points; assert any(ep.name == 'b3' for ep in entry_points(group='opentelemetry_propagator'))"
    - python -c "from importlib.metadata import entry_points; assert any(ep.name == 'b3multi' for ep in entry_points(group='opentelemetry_propagator'))"
    - pytest -vv tests

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/propagator/opentelemetry-propagator-b3
  summary: OpenTelemetry B3 Propagator
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  description: |
    This library provides a propagator for the B3 format
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/propagator/opentelemetry-propagator-b3
  doc_url: https://github.com/open-telemetry/opentelemetry-python/blob/main/propagator/opentelemetry-propagator-b3/README.rst

extra:
  recipe-maintainers:
    - twoodwark
